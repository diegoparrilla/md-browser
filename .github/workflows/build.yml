name: Build

# Trigger when a pull request is received
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      STCMD_NO_TTY: 1
    strategy:
      matrix:
        python-version: [ "3.10" ]
        include:
          - os: ubuntu-latest
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install the Pico Toolchain
      run: |
          sudo DEBIAN_FRONTEND=noninteractive apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential libstdc++-arm-none-eabi-newlib

    - name: Install AtariST Toolkit Docker image
      # -f and pipefail are load-bearing: with plain `curl -sL ... | bash` a failed
      # download is silent, bash gets an empty script and exits 0, so the step goes
      # green having installed nothing and the build then dies with a confusing
      # "stcmd: command not found" (v2.1.1 release, run 30564106865).
      run: |
        set -o pipefail
        curl -sSLf https://github.com/sidecartridge/atarist-toolkit-docker/releases/download/v1.3.0/install_atarist_toolkit_docker.sh | bash

    - name: Run - Build PICO_W release version
      run: ./build.sh pico_w Release ${{ secrets.APP_UUID }}
